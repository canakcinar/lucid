name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # test runs the fast checks across every supported platform. The matrix is what
  # gives Windows + macOS coverage: procgroup_unix.go and procgroup_other.go are
  # under build tags, so ONLY a real cross-platform run proves both compile and
  # test. A ubuntu-only pipeline would silently miss a broken //go:build !unix
  # branch until a user tried to install on Windows.
  test:
    name: vet + build + test-short (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go build ./...
      - run: go test -short ./...

  # test-race runs the concurrency stress suite under -race. Unix-only: the -race
  # detector needs cgo and the runners' native toolchain, and the Windows race
  # detector on GitHub's stock image has historically been fragile — pin the
  # signal to Linux + macOS so a flake there doesn't hide a real Linux race.
  test-race:
    name: test -race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test -race ./...

  # audit runs the -audit integration self-check plus the //go:build integration
  # tag suite. Kept on ubuntu only: the audit stands up an in-process httptest
  # server that binds to 127.0.0.1 and depends on POSIX-y process semantics
  # (setpgid teardown) — worth one green signal there; the cross-platform build
  # is proved by the matrix job above.
  audit:
    name: audit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -o sift ./...
      - run: ./sift -audit
      - run: go test -tags=integration -run TestRunAudit_Integration ./...
